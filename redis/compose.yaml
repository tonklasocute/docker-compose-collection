# Redis 7.4 (AOF persistence) + RedisInsight
#
#   cp .env.example .env              # then change the password
#   docker compose up -d --wait       # Redis only
#   docker compose --profile tools up -d --wait   # + RedisInsight

services:
  redis:
    image: redis:7.4.11-alpine3.21
    restart: unless-stopped
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    environment:
      # redis-cli reads this, so `redis-cli ping` in the healthcheck and
      # `make cli` authenticate without putting the password on the command line
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      # Reachable from this machine only. To expose it on your network, drop
      # the "127.0.0.1:" prefix - and use a strong password first.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [cache]

  redisinsight:
    image: redis/redisinsight:3.4.2
    profiles: [tools]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      RI_ACCEPT_TERMS_AND_CONDITIONS: "true"
      # Pre-register the Redis above as a database
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: "6379"
      RI_REDIS_ALIAS: redis (compose)
      RI_REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDISINSIGHT_PORT:-5540}:5540"
    volumes:
      - redisinsight-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5540/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [cache]

volumes:
  redis-data:
  redisinsight-data:

networks:
  cache:
