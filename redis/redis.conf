# Redis configuration for this stack. The password is passed on the command
# line from .env (see compose.yaml), so it never lives in this file.

# --- Persistence ---------------------------------------------------------------
# Append-only file: every write is logged and fsynced once per second, so at
# most ~1s of writes is lost on a crash. The AOF starts with an RDB snapshot
# (preamble) so restarts load quickly.
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes
# Also keep periodic RDB snapshots (handy for backups: copy /data/dump.rdb).
save 3600 1 300 100 60 10000
dir /data

# --- Memory --------------------------------------------------------------------
# Keep below the container memory limit (512m) to leave room for AOF rewrites.
# noeviction = writes fail when full, nothing is silently dropped. For a pure
# cache, use allkeys-lru instead.
maxmemory 256mb
maxmemory-policy noeviction

# --- Network -------------------------------------------------------------------
bind 0.0.0.0
port 6379
tcp-keepalive 300
