# PostgreSQL 16 + pgAdmin 4
#
#   cp .env.example .env              # then change the passwords
#   docker compose up -d --wait       # PostgreSQL only
#   docker compose --profile tools up -d --wait   # + pgAdmin

services:
  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      # Read by init/01-create-app-db.sh on the first start only
      APP_DB_NAME: ${APP_DB_NAME:-app}
      APP_DB_USER: ${APP_DB_USER:-app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    ports:
      # Reachable from this machine only. To expose it on your network, drop
      # the "127.0.0.1:" prefix - and use strong passwords first.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Scripts here run once, when the data volume is empty
      - ./init:/docker-entrypoint-initdb.d:ro
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g
    networks: [db]

  pgadmin:
    image: dpage/pgadmin4:9.18.0
    profiles: [tools]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?set PGADMIN_PASSWORD in .env}
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
      # Don't ask for the master password on every login (local dev tool)
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      # Pre-registers the "postgres" server on first login
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/misc/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [db]

volumes:
  postgres-data:
  pgadmin-data:

networks:
  db:
