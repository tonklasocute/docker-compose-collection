# Go REST API + PostgreSQL 16 + migrations, with a hot-reload dev profile
#
#   cp .env.example .env                       # then set POSTGRES_PASSWORD
#   docker compose up -d --build --wait        # postgres -> migrate -> api on :8080
#   docker compose --profile dev up -d --wait  # + api-dev with hot reload on :8081

x-database-url: &database-url postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-app}?sslmode=disable

services:
  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      # Reachable from this machine only; drop "127.0.0.1:" to expose it.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [backend]

  # One-shot: applies migrations/*.up.sql, then exits. The API waits for it.
  migrate:
    image: migrate/migrate:v4.20.1
    depends_on:
      postgres:
        condition: service_healthy
    command: ["-path=/migrations", "-database", *database-url, "up"]
    volumes:
      - ./migrations:/migrations:ro
    restart: "no"
    networks: [backend]

  api:
    build:
      context: .
      target: final
      args:
        VERSION: ${API_VERSION:-1.0.0}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: *database-url
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    # Hardening: the binary needs no writable filesystem and no capabilities
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/app/api", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128m
    networks: [backend]

  # Same API, run by air from the bind-mounted source: edit a .go file and it
  # rebuilds and restarts in a second or two.
  api-dev:
    profiles: [dev]
    build:
      context: .
      target: dev
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: *database-url
      PORT: "8080"
      LOG_LEVEL: debug
    ports:
      - "127.0.0.1:${API_DEV_PORT:-8081}:8080"
    working_dir: /src
    volumes:
      - .:/src
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      # the first `go build` inside the container takes a while
      start_period: 60s
    networks: [backend]

volumes:
  postgres-data:
  go-mod-cache:
  go-build-cache:

networks:
  backend:
