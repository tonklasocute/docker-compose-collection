# air: rebuild and restart the API whenever a .go file changes (profile: dev)
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  entrypoint = ["./tmp/api"]
  include_ext = ["go"]
  exclude_dir = ["tmp", "migrations"]
  delay = 500
  # File-change events don't cross bind mounts reliably on Docker Desktop
  # (macOS/Windows), so poll instead of using inotify.
  poll = true
  poll_interval = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = "2s"

[log]
  time = false

[misc]
  clean_on_exit = true
