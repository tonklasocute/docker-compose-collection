# NestJS API + PostgreSQL 16 + Redis 7, with prod and dev (watch) targets
#
#   cp .env.example .env                       # then set the passwords
#   docker compose up -d --build --wait        # prod image on :3000
#   docker compose --profile dev up -d --wait  # + api-dev with watch mode on :3001

x-api-env: &api-env
  DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-app}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
  APP_VERSION: ${API_VERSION:-1.0.0}
  PORT: "3000"

services:
  postgres:
    image: postgres:16.15-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      # Reachable from this machine only; drop "127.0.0.1:" to expose it.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [backend]

  redis:
    image: redis:7.4.11-alpine3.21
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--maxmemory", "128mb",
              "--maxmemory-policy", "allkeys-lru", "--save", ""]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 192m
    networks: [backend]

  api:
    build:
      context: .
      target: prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      NODE_ENV: production
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    # Hardening: nothing in the app writes to disk
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256m
    networks: [backend]

  # `nest start --watch` on the bind-mounted src/: save a file, it recompiles
  # and restarts.
  api-dev:
    profiles: [dev]
    build:
      context: .
      target: dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      NODE_ENV: development
    ports:
      - "127.0.0.1:${API_DEV_PORT:-3001}:3000"
    volumes:
      - ./src:/app/src:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    networks: [backend]

volumes:
  postgres-data:

networks:
  backend:
