# MinIO-compatible S3 object storage (PGSTY Silo) with buckets and an app
# user created on start
#
#   cp .env.example .env              # then change the passwords
#   docker compose up -d --wait       # S3 API on :9000, web console on :9001

services:
  minio:
    # Silo: the maintained community fork of the MinIO server. Upstream stopped
    # publishing images and archived its repository (see README.md)
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      # Read by setup.sh (post_start hook)
      MINIO_BUCKETS: ${MINIO_BUCKETS:-app}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:-app}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?set MINIO_APP_SECRET_KEY in .env}
      MINIO_BROWSER_REDIRECT_URL: http://localhost:${MINIO_CONSOLE_PORT:-9001}
    ports:
      # Reachable from this machine only. To expose them on your network, drop
      # the "127.0.0.1:" prefix - and use strong credentials first.
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
      - ./setup.sh:/usr/local/bin/setup.sh:ro
    # Creates the buckets and the app user once the server is up
    post_start:
      - command: ["sh", "/usr/local/bin/setup.sh"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1g
    networks: [storage]

volumes:
  minio-data:

networks:
  storage:
