# MySQL 8.4 LTS + Adminer
#
#   cp .env.example .env              # then change the passwords
#   docker compose up -d --wait       # MySQL only
#   docker compose --profile tools up -d --wait   # + Adminer

services:
  mysql:
    image: mysql:8.4.13
    restart: unless-stopped
    # Server tuning as flags rather than a mounted my.cnf: MySQL ignores config
    # files that look world-writable, which bind mounts on Docker Desktop do.
    command:
      - --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL_SIZE:-256M}
      - --max-connections=200
      - --skip-name-resolve
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      # The image creates this database and user on first start
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      TZ: ${TZ:-UTC}
    ports:
      # Reachable from this machine only. To expose it on your network, drop
      # the "127.0.0.1:" prefix - and use strong passwords first.
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # *.sql / *.sh here run once, in MYSQL_DATABASE, when the volume is empty
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP on purpose: the temporary server used during init listens on the
      # socket only, so this stays unhealthy until init scripts have finished.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysql -h 127.0.0.1 -uroot -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
    networks: [db]

  adminer:
    image: adminer:5.5.1
    profiles: [tools]
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://127.0.0.1:8080/\") === false ? 1 : 0);'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128m
    networks: [db]

volumes:
  mysql-data:

networks:
  db:
