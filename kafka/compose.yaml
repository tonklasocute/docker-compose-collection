# Apache Kafka 4 in KRaft mode (no ZooKeeper) + Kafka UI
#
#   cp .env.example .env
#   docker compose up -d --wait       # Kafka + topic init
#   docker compose --profile tools up -d --wait   # + Kafka UI

services:
  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    environment:
      # Single node acting as both broker and KRaft controller
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?set KAFKA_CLUSTER_ID in .env}
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL: other containers (kafka:29092)
      # EXTERNAL: apps on the host (localhost:KAFKA_PORT)
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # One broker, so internal topics can only have one replica
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: ${KAFKA_AUTO_CREATE_TOPICS:-false}
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_RETENTION_HOURS:-168}
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports:
      # Reachable from this machine only. Exposing Kafka beyond localhost also
      # means changing the EXTERNAL advertised listener to a reachable host
      # name - and adding SASL/TLS, since these listeners are plaintext.
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g
    networks: [kafka]

  # One-shot: creates the topics listed in KAFKA_TOPICS, then exits.
  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      TOPICS: ${KAFKA_TOPICS:-}
      PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        for t in $${TOPICS//,/ }; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
            --topic "$$t" --partitions "$$PARTITIONS" --replication-factor 1
        done
    restart: "no"
    networks: [kafka]

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    profiles: [tools]
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "false"
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: ${KAFKA_UI_USER:-admin}
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_PASSWORD:?set KAFKA_UI_PASSWORD in .env}
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [kafka]

volumes:
  kafka-data:

networks:
  kafka:
