# The only public entry point. Routes /api/ to the Go API and everything else
# to Next.js. Runs as an unprivileged user on port 8080 inside the container.

worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Writable paths live in /tmp so the container can run read-only
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  gzip on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # One JSON object per request: easy to ship to Loki (see ../logging)
  log_format json escape=json '{"time":"$time_iso8601","method":"$request_method","uri":"$request_uri",'
                              '"status":$status,"bytes":$body_bytes_sent,"duration":$request_time,'
                              '"upstream":"$upstream_addr","upstream_time":"$upstream_response_time"}';
  access_log /dev/stdout json;
  error_log /dev/stderr warn;

  # 20 requests/s per client IP on the API, bursts up to 40
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_status 429;

  # Re-resolve service names through Docker's DNS. Without this nginx keeps
  # the IP it saw at startup, and recreating `web` or `api` (a redeploy)
  # means 502s until nginx is restarted.
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream web {
    zone upstreams 64k;
    server web:3000 resolve;
    keepalive 16;
  }

  upstream api {
    zone upstreams 64k;
    server api:8080 resolve;
    keepalive 16;
  }

  server {
    listen 8080;
    server_name _;
    client_max_body_size 1m;

    # Security headers on every response. Keep add_header out of the
    # locations below: one there would replace all of these for that location.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Lets the page show that the request really came through nginx
    proxy_set_header X-Proxied-By nginx;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    location = /nginx-health {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://api;
    }

    # API liveness under the public prefix
    location = /api/health {
      proxy_pass http://api/health;
    }

    location / {
      proxy_pass http://web;
    }
  }
}
