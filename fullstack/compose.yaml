# Next.js + Go API + PostgreSQL behind an nginx reverse proxy
#
#   cp .env.example .env              # then set POSTGRES_PASSWORD
#   docker compose up -d --build --wait
#   open http://localhost:8080        # nginx is the only published port
#
#   browser -> nginx :8080 -> /api/* -> api :8080 -> postgres
#                           -> /*     -> web :3000 -> (server-side) api :8080

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-database-url: &database-url postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-app}?sslmode=disable

services:
  nginx:
    image: nginxinc/nginx-unprivileged:1.31.7-alpine3.24
    restart: unless-stopped
    <<: *hardening
    tmpfs: [/tmp]
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      # The single entry point. Bound to localhost; drop "127.0.0.1:" (and put
      # TLS in front, e.g. ../traefik) to serve it to other machines.
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64m
    networks: [frontend]

  web:
    build: ./web
    restart: unless-stopped
    <<: *hardening
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Server-side rendering calls the API directly on the backend network
      API_INTERNAL_URL: http://api:8080
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256m
    networks: [frontend, backend]

  api:
    build:
      context: ./api
      target: final
      args:
        VERSION: ${API_VERSION:-1.0.0}
    restart: unless-stopped
    <<: *hardening
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: *database-url
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "/app/api", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128m
    networks: [frontend, backend]

  # One-shot: applies api/migrations, then exits
  migrate:
    image: migrate/migrate:v4.20.1
    depends_on:
      postgres:
        condition: service_healthy
    command: ["-path=/migrations", "-database", *database-url, "up"]
    volumes:
      - ./api/migrations:/migrations:ro
    restart: "no"
    networks: [backend]

  postgres:
    image: postgres:16.15-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    # Not published: only the backend network can reach it. To connect from
    # the host, add:  ports: ["127.0.0.1:5432:5432"]   (or use `make psql`)
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [backend]

volumes:
  postgres-data:

networks:
  # nginx, web and api. Postgres is not on it.
  frontend:
  # web, api, migrate and postgres. Marked internal: no route to the internet.
  backend:
    internal: true
