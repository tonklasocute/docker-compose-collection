# Prometheus configuration. Reload after editing:
#   curl -X POST http://localhost:9090/-/reload     (or: make reload)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

# Add your own services to scrape_configs, e.g. an app on the same network
# exposing /metrics:
#   - job_name: my-app
#     static_configs:
#       - targets: ["my-app:8080"]
