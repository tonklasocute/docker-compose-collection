# Keycloak 26 (optimized build, production mode over HTTP) + PostgreSQL 16
#
#   cp .env.example .env                  # then change the passwords
#   docker compose up -d --build --wait   # postgres -> keycloak, imports realms/
#
# Production mode with plain HTTP is fine on localhost. For a real deployment,
# put it behind a TLS proxy (see ../traefik) and set KEYCLOAK_URL to https://.

services:
  postgres:
    image: postgres:16.15-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keycloak}
      POSTGRES_USER: ${POSTGRES_USER:-keycloak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # No ports: only Keycloak talks to this database. Add
    # "127.0.0.1:5432:5432" under ports: to reach it from the host.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [keycloak]

  keycloak:
    build:
      context: .
      target: final
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-keycloak}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Tokens and redirects use this URL. Requests from other containers to
      # http://keycloak:8080 still work (backchannel URL follows the request).
      KC_HOSTNAME: ${KEYCLOAK_URL:-http://localhost:${KEYCLOAK_PORT:-8080}}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_LOG_LEVEL: ${KEYCLOAK_LOG_LEVEL:-INFO}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      # Substituted into realms/*.json placeholders during the import
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?set DEMO_USER_PASSWORD in .env}
      DEMO_CLIENT_SECRET: ${DEMO_CLIENT_SECRET:?set DEMO_CLIENT_SECRET in .env}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      # --import-realm imports each file once; existing realms are skipped
      - ./realms:/opt/keycloak/data/import:ro
    healthcheck:
      # No curl in the image: speak HTTP to the management port via bash.
      # /health/ready answers 200 only once the realms are imported (503 before).
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -n1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
    networks: [keycloak]

volumes:
  postgres-data:

networks:
  keycloak:
